
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 40px 20px;
        }

        section {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            padding: 20px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website!</h1>
        <p>Learning HTML, CSS and JavaScript</p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>Hello! I am a student learning web development.</p>
    </section>

    <section>
        <h2>My First Project</h2>
        <p>This is my first webpage created using HTML and CSS.</p>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Congratulations! JavaScript is working!";
        }
    </script>

</body>
</html>
